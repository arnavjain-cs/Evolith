[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-hackathon"
version = "1.0.0"
description = "A transparent workbench for composing compatible LoRA specialists"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=1.26,<3",
  "safetensors>=0.5,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ml = ["torch>=2.5,<3", "transformers>=4.51,<5", "peft>=0.17,<0.19", "accelerate>=1.6,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: optional offline torch/transformers integration tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

